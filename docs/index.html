<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dota Drafter</title>
  <link rel="icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <div class="logo">[D]</div>
      <span class="logo-title">Dota_Drafter</span>
      <div class="header-right">
        <button id="lang-toggle" class="lang-btn">EN</button>
      </div>
    </div>
  </header>

  <section class="hero section">
    <div class="container">
      <h1 class="section-title">Dota 2 Draft Analyzer</h1>
      <p class="section-subtitle" data-i18n="heroSubtitle"></p>
      <div class="carousel">
        <div class="carousel-inner">
          <button class="carousel-btn carousel-prev" aria-label="Previous"></button>
          <div class="carousel-track-wrap">
            <div class="carousel-track">
              <div class="carousel-slide">
                <img class="carousel-img" src="screenshot1.png" data-i18n-alt="screenshotAlt" alt="">
              </div>
              <div class="carousel-slide">
                <img class="carousel-img" src="screenshot2.png" data-i18n-alt="screenshotAlt" alt="">
              </div>
              <div class="carousel-slide">
                <img class="carousel-img" src="screenshot3.png" data-i18n-alt="screenshotAlt" alt="">
              </div>
            </div>
          </div>
          <button class="carousel-btn carousel-next" aria-label="Next"></button>
        </div>
        <div class="carousel-dots">
          <span class="carousel-dot active"></span>
          <span class="carousel-dot"></span>
          <span class="carousel-dot"></span>
        </div>
      </div>
      <a class="btn-download" href="https://github.com/yphilistine/dota_drafter/releases/latest/download/dota_drafter_setup.exe" data-i18n="downloadBtn"></a>
    </div>
  </section>

  <section class="section" id="features">
    <div class="container">
      <h2 class="section-title" data-i18n="featuresTitle"></h2>
      <div class="features-grid">
        <div class="feature-card">
          <h3 data-i18n="feat1Title"></h3>
          <p data-i18n="feat1Desc"></p>
        </div>
        <div class="feature-card">
          <h3 data-i18n="feat2Title"></h3>
          <p data-i18n="feat2Desc"></p>
        </div>
        <div class="feature-card">
          <h3 data-i18n="feat3Title"></h3>
          <p data-i18n="feat3Desc"></p>
        </div>
        <div class="feature-card">
          <h3 data-i18n="feat4Title"></h3>
          <p data-i18n="feat4Desc"></p>
        </div>
        <div class="feature-card">
          <h3 data-i18n="feat5Title"></h3>
          <p data-i18n="feat5Desc"></p>
        </div>
        <div class="feature-card">
          <h3 data-i18n="feat6Title"></h3>
          <p data-i18n="feat6Desc"></p>
        </div>
      </div>
    </div>
  </section>

  <section class="section" id="how-it-works">
    <div class="container">
      <h2 class="section-title" data-i18n="howTitle"></h2>
      <div class="steps">
        <div class="step">
          <div class="step-num">1</div>
          <div class="step-text">
            <h3 data-i18n="step1Title"></h3>
            <p data-i18n="step1Desc"></p>
          </div>
        </div>
        <div class="step">
          <div class="step-num">2</div>
          <div class="step-text">
            <h3 data-i18n="step2Title"></h3>
            <p data-i18n="step2Desc"></p>
          </div>
        </div>
        <div class="step">
          <div class="step-num">3</div>
          <div class="step-text">
            <h3 data-i18n="step3Title"></h3>
            <p data-i18n="step3Desc"></p>
          </div>
        </div>
        <div class="step">
          <div class="step-num">4</div>
          <div class="step-text">
            <h3 data-i18n="step4Title"></h3>
            <p data-i18n="step4Desc"></p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="section" id="friend-id">
    <div class="container">
      <h2 class="section-title" data-i18n="friendIdTitle"></h2>
      <p class="section-subtitle" data-i18n="friendIdSubtitle"></p>
      <div class="friend-id-steps">
        <div class="friend-id-step">
          <img class="friend-id-img" src="step1.png" alt="Add Friend button in Steam friends list">
          <div class="friend-id-step-body">
            <div class="step-num">1</div>
            <p data-i18n="friendIdStep1"></p>
          </div>
        </div>
        <div class="friend-id-step">
          <img class="friend-id-img" src="step2.png" alt="Copy Friend ID in Add Friend dialog">
          <div class="friend-id-step-body">
            <div class="step-num">2</div>
            <p data-i18n="friendIdStep2"></p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="section" id="requirements">
    <div class="container">
      <h2 class="section-title" data-i18n="reqTitle"></h2>
      <ul class="req-list">
        <li data-i18n="req1"></li>
        <li data-i18n="req2"></li>
        <li data-i18n="req3"></li>
        <li data-i18n="req4"></li>
      </ul>
    </div>
  </section>

  <section class="section download-section" id="download">
    <div class="container">
      <h2 class="section-title" data-i18n="dlTitle"></h2>
      <a class="btn-download" href="https://github.com/yphilistine/dota_drafter/releases/latest/download/dota_drafter_setup.exe" data-i18n="dlBtn"></a>
      <div class="install-steps">
        <ol>
          <li data-i18n="inst1"></li>
          <li data-i18n="inst2"></li>
          <li data-i18n="inst3"></li>
          <li data-i18n="inst4"></li>
        </ol>
      </div>
    </div>
  </section>

  <section class="section powered-section">
    <div class="container">
      <div class="powered-columns">
        <div class="powered-col">
          <p class="powered-label" data-i18n="poweredBy">Данные предоставлены</p>
          <div class="powered-grid">
            <a class="powered-card" href="https://www.opendota.com" target="_blank" rel="noopener">
              <img class="powered-icon" src="https://www.google.com/s2/favicons?domain=opendota.com&sz=64" alt="OpenDota">
            </a>
            <a class="powered-card" href="https://stratz.com" target="_blank" rel="noopener">
              <img class="powered-icon" src="https://www.google.com/s2/favicons?domain=stratz.com&sz=64" alt="STRATZ">
            </a>
            <a class="powered-card" href="https://d2pt.gg" target="_blank" rel="noopener">
              <img class="powered-icon" src="https://www.google.com/s2/favicons?domain=d2pt.gg&sz=64" alt="D2PT">
            </a>
          </div>
        </div>
        <div class="powered-col">
          <p class="powered-label" data-i18n="contactLabel">Контакты</p>
          <div class="powered-grid">
            <a class="powered-card" href="https://discordapp.com/users/693097611674255400" target="_blank" rel="noopener">
              <img class="powered-icon" src="https://www.google.com/s2/favicons?domain=discord.com&sz=64" alt="Discord">
            </a>
            <a class="powered-card" href="https://github.com/yphilistine/dota_drafter/tree/main/finalapp" target="_blank" rel="noopener">
              <img class="powered-icon" src="https://www.google.com/s2/favicons?domain=github.com&sz=64" alt="GitHub">
            </a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-links">
        <a href="https://github.com/yphilistine/dota_drafter/tree/main/finalapp" data-i18n="footerRepo"></a>
        <span id="footer-version" data-i18n="footerVersion"></span>
      </div>
      <p>&copy; 2025-2026 Dota Drafter</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
